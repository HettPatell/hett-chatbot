<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hett — Simple Text Chatbot</title>
  <meta name="description" content="Hett is a simple, modern chatbot focused on clean typography, clarity, and distraction-free communication.">
  
  <!-- Fonts: High-legibility modern sans-serif & monospace -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Local Mozilla PDF.js for 100% reliable PDF reading (No CORS / Worker blocks) -->
  <script src="pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';
    }
  </script>

  <link rel="stylesheet" href="style.css?v=3.0">
</head>
<body>
  <!-- App Container -->
  <main class="app-container" role="main">
    <div class="chat-wrapper">
      
      <!-- Minimalist Header -->
      <header class="header">
        <div class="header-brand">
          <span class="brand-title">Hett</span>
          <span class="brand-divider">/</span>
          <span class="brand-status">🟢 Online</span>
        </div>
        
        <nav class="header-controls" aria-label="Controls">
          <button type="button" id="themeToggleBtn" class="text-btn" aria-label="Toggle theme">☀️ Light</button>
          <button type="button" id="openSettingsBtn" class="text-btn" aria-label="Settings">⚙️ Settings</button>
          <button type="button" id="clearChatBtn" class="text-btn" aria-label="Clear chat">🗑️ Clear</button>
        </nav>
      </header>

      <!-- Chat Log Area -->
      <section id="chatLog" class="chat-log" role="log" aria-live="polite">
      </section>

      <!-- Typing Indicator -->
      <div id="typingIndicator" class="typing-notice hidden" aria-hidden="true">
        <span class="typing-text">Hett is thinking...</span>
      </div>

      <!-- Input Area -->
      <footer class="footer">
        <!-- Attachment Popover Menu (Opens above 📎) -->
        <div id="attachmentMenu" class="attachment-menu hidden" role="menu" aria-label="Attach options">
          <button type="button" class="attach-menu-item" id="menuItemImage" role="menuitem">
            <span class="menu-icon">🖼️</span>
            <div class="menu-text">
              <span class="menu-title">Photo / Image</span>
              <span class="menu-desc">PNG, JPG, WebP, GIF</span>
            </div>
          </button>
          <button type="button" class="attach-menu-item" id="menuItemPdf" role="menuitem">
            <span class="menu-icon">📄</span>
            <div class="menu-text">
              <span class="menu-title">Document / PDF</span>
              <span class="menu-desc">PDF, TXT documents</span>
            </div>
          </button>
          <button type="button" class="attach-menu-item" id="menuItemVideo" role="menuitem">
            <span class="menu-icon">🎥</span>
            <div class="menu-text">
              <span class="menu-title">Video File</span>
              <span class="menu-desc">MP4, WebM, MOV</span>
            </div>
          </button>
          <button type="button" class="attach-menu-item" id="menuItemAudio" role="menuitem">
            <span class="menu-icon">🎵</span>
            <div class="menu-text">
              <span class="menu-title">Audio / Voice</span>
              <span class="menu-desc">MP3, WAV, M4A, OGG</span>
            </div>
          </button>
        </div>

        <!-- Attachment Preview Tray -->
        <div id="attachmentTray" class="attachment-tray hidden">
          <div id="attachmentPreview" class="attachment-preview"></div>
          <button type="button" id="removeAttachmentBtn" class="remove-attachment-btn" title="Remove attachment" aria-label="Remove attachment">✕</button>
        </div>

        <form id="chatForm" class="chat-form">
          <!-- Hidden Inputs for Each Media Type -->
          <input type="file" id="imageFileInput" accept="image/*" style="display: none;">
          <input type="file" id="pdfFileInput" accept=".pdf,text/plain" style="display: none;">
          <input type="file" id="videoFileInput" accept="video/*" style="display: none;">
          <input type="file" id="audioFileInput" accept="audio/*" style="display: none;">

          <!-- Attach File Button -->
          <button type="button" id="attachFileBtn" class="attach-btn" title="Add Image, PDF, Video or Audio" aria-label="Attach file">📎</button>

          <textarea 
            id="userInput" 
            class="chat-textarea" 
            placeholder="Type a message or attach Image, PDF, Video, Audio..." 
            rows="1" 
            maxlength="2500" 
            aria-label="Message to Hett"></textarea>
          <button type="submit" id="sendBtn" class="send-btn" aria-label="Send message">Send 📤</button>
        </form>
        <div class="input-info">
          <span>Press Enter to send • Shift + Enter for newline • Paste screenshots with Ctrl+V</span>
        </div>
      </footer>

    </div>
  </main>

  <!-- Settings Dialog -->
  <div id="settingsModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="settingsHeading">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="settingsHeading" class="modal-title">⚙️ Settings</h2>
        <button type="button" id="closeSettingsBtn" class="text-btn" aria-label="Close settings">✕ Close</button>
      </div>

      <div class="modal-body">
        <div class="field-group">
          <label for="aiModeSelect">Response Engine</label>
          <select id="aiModeSelect" class="form-select">
            <option value="groq" selected>Groq Cloud (Qwen 3.8 27B Vision + Text)</option>
            <option value="offline">Built-in Text Companion (Zero Setup / Offline)</option>
            <option value="gemini">Google Gemini API (Live)</option>
            <option value="openai">OpenAI / Compatible API (Live)</option>
          </select>
          <span class="field-hint" id="engineHint">Groq delivers ultra-fast responses with native Vision (Images) and Text.</span>
        </div>

        <div id="apiKeyGroup" class="field-group">
          <label for="apiKeyInput">API Key</label>
          <input type="password" id="apiKeyInput" class="form-input" placeholder="Paste your API key here">
          <span class="field-hint">Keys remain client-side in your local browser storage only.</span>
        </div>

        <div id="modelGroup" class="field-group">
          <label for="modelInput">Model Name</label>
          <input type="text" id="modelInput" class="form-input" value="qwen/qwen3.8-27b">
        </div>

        <div class="field-group">
          <label for="userNickname">Your Name</label>
          <input type="text" id="userNickname" class="form-input" placeholder="User" maxlength="30">
        </div>

        <div class="field-group">
          <label for="fontSelect">Typography Style</label>
          <select id="fontSelect" class="form-select">
            <option value="sans">Modern Sans (Plus Jakarta Sans)</option>
            <option value="mono">Monospace Terminal (JetBrains Mono)</option>
          </select>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" id="saveSettingsBtn" class="primary-text-btn">Save Preferences</button>
      </div>
    </div>
  </div>

  <!-- Minimal Toast Notification -->
  <div id="toast" class="toast hidden" aria-live="assertive"></div>

  <script src="app.js?v=3.0"></script>
</body>
</html>
